<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Code Architect</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-top: 0;
        }
        .btn-group {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.success {
            background-color: #2ecc71;
        }
        button.success:hover {
            background-color: #27ae60;
        }
        #network-canvas {
            width: 100%;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fafafa;
            margin-bottom: 20px;
        }
        .output-box {
            background: #1e1e1e;
            color: #7ec699;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            max-height: 250px;
            overflow-y: auto;
        }
        .diff-container {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .diff-box {
            flex: 1;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            overflow-x: auto;
        }
        .diff-box h4 {
            margin-top: 0;
            color: #fff;
        }
        .code-orig { color: #e74c3c; }
        .code-patch { color: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Multimodal Code Architect</h1>
    <p>Static Application Security Testing & Automated CPG Remediation Engine</p>

    <div class="btn-group">
        <button onclick="runScan()">🔍 Run Scan</button>
        <button onclick="loadGraph()">🌐 Visualize CPG Graph</button>
        <button class="success" onclick="applyPatch()">🩹 Apply Security Patch</button>
        <button onclick="downloadReport()">📄 Download PDF Report</button>
    </div>

    <h3>CPG Visualizer</h3>
    <div id="network-canvas"></div>

    <h3>Output Log</h3>
    <div id="outputLog" class="output-box">Ready. Click a button to begin.</div>

    <div id="diffViewer" class="diff-container" style="display: none;">
        <div class="diff-box">
            <h4>Original Insecure Code</h4>
            <pre id="origCode" class="code-orig"></pre>
        </div>
        <div class="diff-box">
            <h4>Patched Secure Code</h4>
            <pre id="patchedCode" class="code-patch"></pre>
        </div>
    </div>
</div>

<script>
    // ✅ Uses relative paths directly so requests work on Localhost AND Render
    async function runScan() {
        const log = document.getElementById('outputLog');
        log.innerText = "Scanning repository...";
        try {
            const res = await fetch('/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const data = await res.json();
            log.innerText = JSON.stringify(data, null, 2);
        } catch (err) {
            log.innerText = "Error scanning repository: " + err;
        }
    }

    async function loadGraph() {
        const log = document.getElementById('outputLog');
        log.innerText = "Fetching CPG Graph data...";
        try {
            const res = await fetch('/graph');
            const data = await res.json();
            
            const container = document.getElementById('network-canvas');
            const graphData = {
                nodes: new vis.DataSet(data.nodes),
                edges: new vis.DataSet(data.edges)
            };
            const options = {
                nodes: { shape: 'dot', size: 16 },
                physics: { enabled: true }
            };
            new vis.Network(container, graphData, options);
            log.innerText = "Graph rendered successfully with " + data.nodes.length + " nodes.";
        } catch (err) {
            log.innerText = "Error loading graph: " + err;
        }
    }

    async function applyPatch() {
        const log = document.getElementById('outputLog');
        log.innerText = "Applying security patch...";
        try {
            const res = await fetch('/apply-patch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const data = await res.json();
            log.innerText = data.message;

            if (data.original_code && data.patched_code) {
                document.getElementById('origCode').innerText = data.original_code;
                document.getElementById('patchedCode').innerText = data.patched_code;
                document.getElementById('diffViewer').style.display = 'flex';
            }
        } catch (err) {
            log.innerText = "Error applying patch: " + err;
        }
    }

    function downloadReport() {
        window.open('/download-report', '_blank');
    }
</script>

</body>
</html>
